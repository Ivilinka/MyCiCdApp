name: Android Build & Distribute

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      # 1. Настройка Ruby (нужно для работы Fastlane)
      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true # Автоматически установит гемы из Gemfile

      # 2. Декодирование ключа подписи
      - name: Decode Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > keystore.jks

      # 3. Создание JSON файла для Firebase
      - name: Create Firebase Service Account File
        env:
          FIREBASE_SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: echo "$FIREBASE_SA" > firebase_service_account.json

      # 4. Выдача прав на выполнение Gradle
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # 5. Сборка APK
      - name: Assemble Release APK
        env:
          KEYSTORE_PATH: keystore.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew assembleRelease --no-daemon

      # 6. Запуск Fastlane через bundle (он уже установлен на шаге 1)
      - name: Run Fastlane Distribute
        run: bundle exec fastlane distribute