name: Android CI/CD Build and Distribute

on:
  push:
    branches: [ "main", "master" ] # Запускать при пуше в главную ветку

jobs:
  build-and-distribute:
    runs-on: ubuntu-latest

    steps:
      # 1. Клонируем ваш код из репозитория
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. Настраиваем Java (нужна для Gradle)
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      # 3. Настраиваем Ruby (нужен для Fastlane)
      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3' # Версия должна совпадать с вашей локальной
          bundler-cache: true

      # 4. Распаковываем keystore (ключ подписи) из секретов GitHub
      - name: Decode Keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > keystore.jks

      # 5. Создаем файл для Firebase
      - name: Decode Firebase Credentials
        run: |
          echo "${{ secrets.FIREBASE_SERVICE_ACCOUNT }}" | base64 --decode > firebase_service_account.json

      # 6. Запускаем Fastlane
      - name: Run Fastlane
        env:
          # Передаем пароли из секретов GitHub
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: bundle exec fastlane distribute